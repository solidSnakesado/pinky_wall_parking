# src/pinky_wall_parking_sim/config/scene_line_parallel_230.yaml - 라인 평행 주차 칸 3 개 (230 mm), 앞뒤 칸에 핑키
#
# 칸 = 230 x 120 mm (영상 방식 = 후진 S 자 + 짧은 전진, 기어 2 개가 후진·전진 진입 모두 되는 길이. 핑키 1.95 L.
#   연석 선 안쪽 여유 3 mm, 이웃 여유 8 mm 기준 계산: 210 mm 는 후진 진입 불가, 230 mm 부터 가능).
# 장면 좌표 (m): 로봇 출발 = 원점, +x 방향 (차선). 칸은 차선 오른쪽, 길이 방향 = +x.
#   가운데 칸 (빈 칸) 중심 (0.600, -0.200), 앞뒤 칸 중심 x 0.370 / 0.830. 연석 쪽 선 y -0.260, 차선 쪽 선 y -0.140.
#   세워 둔 핑키 = 앞뒤 칸 가운데 (차체 중심 = 칸 중심 -> base_footprint x = 칸 중심 + 0.017). 빈 길이 = 0.342 m.
# 라인 = 바닥 표시만 (충돌·라이다 없음), 폭 5 mm.
name: line_parallel_230
board: {x: [-0.40, 1.40], y: [-0.32, 0.50]}
boxes: []
lines:
  - {name: curb_line, p0: [0.255, -0.260], p1: [0.945, -0.260]}
  - {name: lane_line, p0: [0.255, -0.140], p1: [0.945, -0.140]}
  - {name: div_0, p0: [0.255, -0.260], p1: [0.255, -0.140]}
  - {name: div_1, p0: [0.485, -0.260], p1: [0.485, -0.140]}
  - {name: div_2, p0: [0.715, -0.260], p1: [0.715, -0.140]}
  - {name: div_3, p0: [0.945, -0.260], p1: [0.945, -0.140]}
parked:
  - {x: 0.387, y: -0.200, yaw_deg: 0}
  - {x: 0.847, y: -0.200, yaw_deg: 0}
start: {x: 0.0, y: 0.0, yaw_deg: 0}
