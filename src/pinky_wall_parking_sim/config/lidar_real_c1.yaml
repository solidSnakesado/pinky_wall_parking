# src/pinky_wall_parking_sim/config/lidar_real_c1.yaml - 시뮬 스캔에 덧입힐 실물 RPLIDAR C1 특성 (scan_realism_node)
# 근거: 실측 = 2026-11-17 ~ 18 녹화 (칸 안 c1~c5, k1~k4), 추정 = 아직 못 잼 (실측 후 이 파일만 바꿈)
scan_realism:
  ros__parameters:
    return_deg: [10.0, 18.0, 25.0, 35.0, 50.0]            # 입사각 구간 경계 (deg, 0 = 스침)
    return_prob: [0.15, 0.12, 0.65, 0.88, 0.95, 0.96]     # 실측: 구간별 돌아옴 확률 (p1~p5, c1~c5, bag_dropout)
    neighbor_ratio: 11.5                                  # 이웃 점 최대 간격 = 비 x 거리 x 광선 간격 (5° 까지 판정)
    near_r: [0.065, 0.075, 0.085, 0.095, 0.105]           # 실측: 잰 거리 (m), REAL_NEAR 와 같은 점
    near_bias: [0.0095, 0.0085, 0.0034, 0.0034, 0.0]      # 실측: 실제보다 멀게 재는 양 (m)
    sigma: 0.0005                                         # 실측: 광선별 거리 흔들림 중앙값 0.5 mm (c2 bag)
    near_drop: 0.060                                      # 실측: 6 cm 미만 값 들쭉날쭉 -> 점 없음
    yaw_offset_deg: -2.2                                  # 실측: 장착 yaw 오차 (k4)
    self_points: [0.0]                                    # [0.0] = 끔. 실측 위치 예 [0.024, -0.029] (라이다 좌표 확인 필요)
    seed: -1                                              # -1 = 매번 다름, 0 이상 = 같은 잡음 재현
