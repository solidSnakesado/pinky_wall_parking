# src/pinky_wall_parking_sim/config/scene_line_parallel_210.yaml - 라인 평행 주차 칸 3 개 (210 mm), 앞뒤 칸에 핑키
#
# 칸 = 210 x 120 mm (영상 방식 = 후진 S 자 + 짧은 전진, 기어 2 개가 되는 길이. 핑키 1.78 L, 계산 근거 slot_search video).
# 장면 좌표 (m): 로봇 출발 = 원점, +x 방향 (차선). 칸은 차선 오른쪽, 길이 방향 = +x.
#   가운데 칸 (빈 칸) 중심 (0.600, -0.200), 앞뒤 칸 중심 x 0.390 / 0.810. 연석 쪽 선 y -0.260, 차선 쪽 선 y -0.140.
#   세워 둔 핑키 = 앞뒤 칸 가운데 (차체 중심 = 칸 중심 -> base_footprint x = 칸 중심 + 0.017). 빈 길이 = 0.302 m.
# 라인 = 바닥 표시만 (충돌·라이다 없음), 폭 5 mm.
name: line_parallel_210
board: {x: [-0.40, 1.40], y: [-0.32, 0.50]}
boxes: []
lines:
  - {name: curb_line, p0: [0.285, -0.260], p1: [0.915, -0.260]}
  - {name: lane_line, p0: [0.285, -0.140], p1: [0.915, -0.140]}
  - {name: div_0, p0: [0.285, -0.260], p1: [0.285, -0.140]}
  - {name: div_1, p0: [0.495, -0.260], p1: [0.495, -0.140]}
  - {name: div_2, p0: [0.705, -0.260], p1: [0.705, -0.140]}
  - {name: div_3, p0: [0.915, -0.260], p1: [0.915, -0.140]}
parked:
  - {x: 0.407, y: -0.200, yaw_deg: 0}
  - {x: 0.827, y: -0.200, yaw_deg: 0}
start: {x: 0.0, y: 0.0, yaw_deg: 0}
