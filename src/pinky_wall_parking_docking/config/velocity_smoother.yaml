# src/pinky_wall_parking_docking/config/velocity_smoother.yaml - 실물 속도 명령 안전 단 (Nav2 velocity_smoother)
#
# - 입력 /cmd_vel_nav (Docking Server) -> 출력 /cmd_vel (pinky_bringup), 런치에서 remap
# - velocity_timeout: 명령이 0.2 s 넘게 안 오면 0 으로 감속 정지 (pinky_bringup 에는 이 기능 없음)
# - 가속·감속 제한은 아주 크게 두어 명령 값을 바꾸지 않음 (변수 제거), 명령 끊김 정지만 사용
# - 순서: [x, y, theta] (차동 구동이라 y = 0)

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 50.0           # 출력 주기 (Hz), Docking Server 20 Hz 보다 빠르게
    scale_velocities: false
    feedback: "OPEN_LOOP"               # 명령 기준 (odom 피드백 안 씀)
    max_velocity: [0.10, 0.0, 1.0]      # 최대 속도 (m/s, -, rad/s), Docking 설정 (0.06, 0.5) 보다 여유
    min_velocity: [-0.10, 0.0, -1.0]
    max_accel: [50.0, 0.0, 50.0]        # 가속 제한 (m/s^2, -, rad/s^2), 사실상 없음
    max_decel: [-50.0, 0.0, -50.0]      # 감속 제한, 사실상 없음
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.2               # 명령 끊김 판정 (s) -> 0 으로 정지
    odom_topic: "odom"
    odom_duration: 0.1